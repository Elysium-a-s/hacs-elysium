upsert_rule:
  name: Install or update rule
  fields:
    rule_json:
      required: true
      selector:
        text:
          multiline: true
remove_rule:
  name: Remove rule
  fields:
    rule_id:
      required: true
      selector:
        text:
create_helper:
  name: Create Elysium helper
  fields:
    helper_json:
      required: true
      selector:
        text:
          multiline: true
update_helper:
  name: Update Elysium helper
  fields:
    helper_json:
      required: true
      selector:
        text:
          multiline: true
replace_helper:
  name: Replace Elysium helper
  description: Creates the successor first and removes the old entity only after creation succeeds.
  fields:
    helper_json:
      required: true
      selector:
        text:
          multiline: true
    replaced_helper_id:
      required: true
      selector:
        text:
delete_helper:
  name: Delete Elysium helper
  fields:
    helper_id:
      required: true
      selector:
        text:
set_helper:
  name: Set Elysium helper state
  fields:
    helper_id:
      required: true
      selector:
        text:
    state:
      required: true
      selector:
        text:
set_agent_token:
  name: Set hub token
  description: >-
    Stores the credential this hub uses to fetch work from the Elysium
    backend. Sent by the mobile app after pairing; the execution loop starts
    without a restart. Base URLs are optional and only needed to point the hub
    at a non-production environment.
  fields:
    agent_token:
      required: true
      selector:
        text:
    integration_base_url:
      required: false
      selector:
        text:
    reward_base_url:
      required: false
      selector:
        text:
    behavior_base_url:
      required: false
      selector:
        text:
