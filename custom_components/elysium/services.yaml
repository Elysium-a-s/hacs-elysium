upsert_rule:
  name: Install or update rule
  fields:
    rule_json:
      required: true
      selector:
        text:
          multiline: true
remove_rule:
  name: Remove rule
  fields:
    rule_id:
      required: true
      selector:
        text:
create_helper:
  name: Create Elysium toggle helper
  description: Creates a persistent switch entity managed by the Elysium integration.
  fields:
    helper_id:
      required: true
      selector:
        text:
    name:
      required: true
      selector:
        text:
    entity_id:
      required: false
      selector:
        text:
    initial_state:
      required: false
      default: "off"
      selector:
        select:
          options:
            - "off"
            - "on"
set_helper:
  name: Set Elysium helper
  fields:
    entity_id:
      required: true
      selector:
        entity:
          domain: switch
    state:
      required: true
      selector:
        select:
          options:
            - "off"
            - "on"
